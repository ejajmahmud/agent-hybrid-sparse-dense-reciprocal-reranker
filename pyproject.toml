[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hybrid-sparse-dense-reciprocal-reranker"
version = "0.1.0"
description = "Reciprocal Rank Fusion (RRF) and cross-attention score normalizer combining BM25 lexical signals with dense vector retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-hybrid-sparse-dense-reciprocal-reranker = "agent_hybrid_sparse_dense_reciprocal_reranker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_hybrid_sparse_dense_reciprocal_reranker*"]
